or (SDO); Distribution Operations Manager", "pay": "about $96,660 (typical)", "entry": "High school diploma + less than 5 years experience", "out": "13,300 jobs"}, "11-9171.00": {"h": "You'd manage a funeral home and look after families on the worst week of their lives.", "t": "Arranging Funeral Director; Funeral Director; Funeral Home Location Manager", "pay": "about $78,790 (typical)", "entry": "Associate's degree; plus less than 5 years of related experience", "out": "about 2,600 openings a year; 58% are self-employed"}, "13-1023.00": {"h": "You'd buy what an organization needs to operate — finding suppliers and negotiating what it costs.", "t": "Buyer; Contract Administrator (Contract Admin); Procurement and Contracting Administrator (Procurement and Contracting Admin)", "pay": "about $77,710 (typical) (BLS reports this with buyers and purchasing agents)", "entry": "Bachelor's degree; learned on the job over a few months (BLS reports this with buyers and purchasing agents)", "out": "about 47,200 openings a year"}, "13-1074.00": {"h": "You'd recruit seasonal farm crews and look after them — the hiring, the transport, the housing.", "t": "nan", "pay": "about $58,460 (typical)", "entry": "No formal educational credential", "out": "7% growth"}, "13-1081.01": {"h": "You'd work out how things should move from A to B, and design the system that gets them there.", "t": "Acquisition Logistics Engineer; Logistics Engineer; Logistics Specialist", "pay": "about $82,320 (typical)", "entry": "Bachelor's degree", "out": "about 26,600 openings a year"}, "13-1111.00": {"h": "You'd go into an organization, work out what isn't working, and propose how to fix it.", "t": "Administrative Analyst; Business Analyst; Business Consultant", "pay": "about $101,860 (typical)", "entry": "Bachelor's degree; plus less than 5 years of related experience", "out": "about 94,100 openings a year"}, "13-1131.00": {"h": "You'd raise the money that keeps a cause going — the asks, the events, the donors.", "t": "Contract Grant Writer; Development Associate; Development Officer", "pay": "about $72,550 (typical)", "entry": "Bachelor's degree", "out": "about 10,000 openings a year"}, "13-1151.00": {"h": "You'd build the training that helps people get better at their jobs, and often deliver it yourself.", "t": "Computer Training Specialist; Corporate Trainer; Job Training Specialist", "pay": "about $69,280 (typical)", "entry": "Bachelor's degree", "out": "about 46,000 openings a year"}, "13-1161.01": {"h": "You'd make things findable — getting content and products in front of people who are searching.", "t": "Digital Marketing Strategist; Digital Media Planner; Internet Marketing Specialist", "pay": "about $78,760 (typical)", "entry": "Bachelor's degree", "out": "about 82,000 openings a year"}, "13-2031.00": {"h": "You'd check that the numbers in a budget hold up, and say so when they don't.", "t": "Budget Analyst; Budget and Policy Analyst; Budget Coordinator", "pay": "about $91,640 (typical)", "entry": "Bachelor's degree", "out": "about 2,900 openings a year"}, "15-1244.00": {"h": "You'd keep an organization's networks running and secure, and fix them when they aren't.", "t": "LAN Administrator (Local Area Network Administrator); LAN Specialist (Local Area Network Specialist); Network Administrator (Network Admin)", "pay": "about $99,130 (typical)", "entry": "Bachelor's degree", "out": "about 13,400 openings a year"}, "15-1254.00": {"h": "You'd build the websites and web systems people use, front to back.", "t": "Technology Applications Engineer; Web Architect; Web Design Specialist", "pay": "about $92,650 (typical)", "entry": "Bachelor's degree", "out": "about 5,300 openings a year"}, "15-1255.01": {"h": "You'd design how a game plays and feels — the mechanics, the story, the rules of its world.", "t": "Design Director; Designer; Environmental Artist", "pay": "about $104,000 (typical)", "entry": "Bachelor's degree", "out": "about 8,300 openings a year"}, "15-1299. l Research Chemist; Biochemist; Biophysics Researcher", "pay": "about $127,410 (typical)", "entry": "Doctoral or professional degree", "out": "about 2,900 openings a year"}, "19-1032.00": {"h": "You'd look after forests and decide how they're used, for timber, recreation, or conservation.", "t": "Area Forester; District Forester; Environmental Protection Forester", "pay": "about $76,400 (typical)", "entry": "Bachelor's degree", "out": "about 900 openings a year"}, "19-2012.00": {"h": "You'd work out the rules the physical world runs on, through experiment and theory.", "t": "Astrophysicist; Biophysics Scientist; Health Physicist", "pay": "about $172,250 (typical)", "entry": "Doctoral or professional degree", "out": "about 1,300 openings a year"}, "19-3011.01": {"h": "You'd put a number on what the environment is worth, and what damage to it costs.", "t": "Environmental Economist; Natural Resource Economist; Research Economist", "pay": "about $124,720 (typical)", "entry": "Master's degree", "out": "about 1,100 openings a year"}, "19-3032.00": {"h": "You'd study how people behave at work — hiring, management, morale — and what actually changes it.", "t": "Consulting Psychologist; I-O Practitioner (Industrial-Organizational Practitioner); I-O Psychologist (Industrial-Organizational Psychologist)", "pay": "about $193,950 (typical)", "entry": "Master's degree; plus an internship or residency", "out": "about 300 openings a year; 80% are self-employed"}, "19-4051.00": {"h": "You'd monitor radiation and the equipment that handles it, in labs and power plants.", "t": "Auxiliary Operator; Equipment Operator; Licensed Nuclear Operator", "pay": "about $110,240 (typical)", "entry": "Associate's degree", "out": "about 900 openings a year"}, "21-1012.00": {"h": "You'd help people work out what to do next in study or work, and how to get there.", "t": "Academic Advisor; Academic Counselor; Admissions Counselor", "pay": "about $64,330 (typical)", "entry": "Master's degree", "out": " k have no degree", "out": "Most people doing this work are self-employed, so the federal wage survey doesn't cover it — there is no reliable national pay figure. Earnings depend on the season, the catch and the boat."}, "45-4011.00": {"h": "You'd plant and tend forests, and do the work that keeps them healthy.", "t": "Christmas Tree Farmer; Conservation Officer; Field Laborer", "pay": "about $43,680 (typical)", "entry": "No formal educational credential", "out": "three-rung ladder; forester rung requires a degree; 27% are self-employed"}, "45-4022.00": {"h": "You'd operate the machines that harvest timber.", "t": "Delimber Operator; Feller Buncher Operator; Harvester Operator", "pay": "about $49,740 (typical)", "entry": "Some jobs require no credential", "out": "about 5,000 openings a year; 30% are self-employed"}, "45-4023.00": {"h": "You'd judge timber for quality and work out what it's worth.", "t": "Log Buyer; Log Check Scaler; Log Grader", "pay": "about $46,330 (typical)", "entry": "Some jobs require no credential", "out": "about 5,000 openings a year; 30% are self-employed"}, "47-2111.00": {"h": "You'd wire a building so the power works and stays safe.", "t": "Control Electrician; Electrical Journey Person; Electrical Troubleshooter", "pay": "about $63,190 (typical)", "entry": "High school diploma, no experience required; apprenticeship is the typical training", "out": "818,700 jobs; about 81,000 openings a year; 9% growth"}, "47-2141.00": {"h": "You'd finish and protect surfaces with paint, from rooms to bridges.", "t": "Building Trades Painter; Commercial Painter; Facilities Painter", "pay": "about $49,400 (typical)", "entry": "No formal educational credential", "out": "3-4 yr paid apprenticeship: 144 hrs instruction + 2,000 hrs paid OJT/yr; 31% are self-employed"}, "47-2231.00": {"h": "You'd put solar panels on roofs and wire them in.", "t": "Journeyman Electrician PV Installer (Journeyman Electrician Photovoltaic Installer); PV Installation Tech (Photovolt r of on-the-job training", "out": "chemical, petroleum and waste-treatment plants all pay near the top of this range"}, "51-9022.00": {"h": "You'd finish surfaces by hand until they're right.", "t": "Buffer; Casting Finisher; Chipper", "pay": "$30,140 to $57,990 (OEWS 2023)", "entry": "No degree required; you learn it on the job", "out": "best-paying settings are nonmetallic mineral products, machine shops and ship and boat building"}, "51-9081.00": {"h": "You'd make dentures and dental appliances to fit one person's mouth.", "t": "Ceramist; Crown and Bridge Dental Laboratory Technician (Crown and Bridge Dental Lab Tech); Dental Ceramist", "pay": "about $49,610 (typical)", "entry": "High school diploma or equivalent", "out": "about 3,600 openings a year"}, "51-9082.00": {"h": "You'd make braces and supports fitted to one person's body.", "t": "Certified Orthotist (CO); Certified Pedorthotist; Certified Prosthetist (CP)", "pay": "about $48,030 (typical)", "entry": "High school diploma or equivalent", "out": "about 1,300 openings a year"}, "51-9195.05": {"h": "You'd throw and finish pottery at production scale.", "t": "Clay Mixer; Glazer; Jigger Artisan", "pay": "about $46,170 (typical)", "entry": "High school diploma or equivalent; learned on the job over a year or more. 74% of people doing this work have no degree", "out": "about 5,100 openings a year"}, "53-1041.00": {"h": "You'd run the crew that loads and secures an aircraft.", "t": "Cargo Supervisor; Ground Operations Supervisor; Line Service Supervisor (LSS)", "pay": "$41,030 to $87,170 (OEWS 2022)", "entry": "High school diploma or equivalent, plus under 5 years of related experience. 72% of people doing this work have no degree", "out": "about 7,950 employed"}, "53-1042.01": {"h": "You'd set up how a community recycles, and keep the program running.", "t": "Heavy Equipment Supervisor; Recycle Coordinator; Recycling Coordinator", "pay": "$39,440 to $92,140 (BLS reports this with transport and material-moving supervisors, OEWS 2023)", "entry": "12% of people in this work faced no minimum education requirement at all; 84% needed a high school diploma. Under 5% needed any degree", "out": "a large supervisory group — about 594,300 employed"}, "53-1044.00": {"h": "You'd lead the staff who look after passengers, and step in when something goes wrong.", "t": "On Car Supervisor; Transit Service Supervisor; Transportation Supervisor", "pay": "about $62,890 (typical) (BLS reports this with transport and material-moving supervisors)", "entry": "High school diploma or equivalent; plus less than 5 years of related experience (BLS reports this with transport and material-moving supervisors)", "out": "about 54,900 openings a year"}, "53-2012.00": {"h": "You'd fly aircraft where scheduled airlines don't — charters, surveys, and one-off routes.", "t": "Captain; Charter Pilot; Check Airman", "pay": "$58,850 to $266,620 (OEWS 2025)", "entry": "Flight training and FAA certificates — no degree typically required, though some employers prefer one", "out": "about 16,400 openings a year across pilot roles; growing 7%"}, "53-2031.00": {"h": "You'd keep a cabin safe and look after everyone in it.", "t": "Flight Attendant; In-Flight Crew Member; Inflight Services Flight Attendant", "pay": "about $63,580 (typical)", "entry": "High school diploma or equivalent", "out": "75-100 flight hours/mo + ~50 ground"}, "53-6051.01": {"h": "You'd inspect aircraft and the systems around them, and ground what isn't right.", "t": "Aircraft Inspector; Aircraft Quality Control Inspector (Aircraft QC Inspector); Airworthiness Safety Inspector", "pay": "about $92,100 (typical)", "entry": "High school diploma or equivalent; learned on the job over a few months", "out": "about 2,300 openings a year"}, "53-6061.00": {"h": "You'd look after passengers on a train, boat, or coach, and keep them safe.", "t": "Attendant; Bus Aide; Bus Assistant", "pay": "$27,040 to $47,680 (OEWS 2023)", "entry": "High school diploma or equiva  the job over a few months", "out": "about 17,600 openings a year"}, "13-1121.00": {"h": "You'd plan events and conferences — the venue, the schedule, the vendors, and the hundred details nobody notices when it goes right.", "t": "Catering Director; Conference Planner; Conference Planning Manager", "pay": "about $61,160 (typical)", "entry": "Bachelor's degree", "out": "about 16,800 openings a year"}, "13-1199.04": {"h": "You'd plan for what a business does when something goes badly wrong — an outage, a disaster — so it can keep running.", "t": "Business Continuity Administrator (Business Continuity Admin); Business Continuity Analyst; Business Continuity and Disaster Recovery Consultant", "pay": "about $83,050 (typical)", "entry": "Bachelor's degree", "out": "about 98,700 openings a year"}, "13-2011.00": {"h": "You'd examine financial records to make sure they're accurate and honest, and explain what they show.", "t": "Accountant; Accounting Officer; Audit Partner", "pay": "about $83,680 (typical)", "entry": "Bachelor's degree", "out": "about 115,300 openings a year"}, "15-1211.01": {"h": "You'd sit between healthcare and technology — shaping the systems clinicians use so they fit how care actually works.", "t": "Clinical Electronic Health Record Nurse (Clinical EHR Nurse); Clinical Informaticist; Clinical Informatics Analyst", "pay": "about $105,850 (typical)", "entry": "Bachelor's degree", "out": "about 32,900 openings a year"}, "15-1299.04": {"h": "You'd try to break into computer systems on purpose, with permission, to find the weaknesses before someone else does.", "t": "Cyber Systems Engineer; Security Consultant; Security Engineer", "pay": "about $116,580 (typical)", "entry": "Bachelor's degree", "out": "about 27,000 openings a year"}, "15-2011.00": {"h": "You'd use statistics to put a number on risk — how likely something is, and what it would cost.", "t": "Actuarial Analyst; Actuarial Associate; Actuarial Consultant", "pay": "about $130,000 (typical)", "ent yst; Actuarial Assistant; Actuarial Associate", "pay": "about $50,330 (typical)", "entry": "Bachelor's degree", "out": "about 500 openings a year"}, "47-2022.00": {"h": "You'd build with stone — walls, piers, walks — cutting and setting it by hand.", "t": "Marble Installer; Marble Shop Worker; Mason", "pay": "about $57,390 (typical)", "entry": "High school diploma or equivalent, then learned through an apprenticeship or on the job — apprentices are paid from the start", "out": "unions and contractor associations sponsor the apprenticeships; after finishing you work as a journey worker"}, "47-2072.00": {"h": "You'd operate the rigs that drive pilings deep into ground or riverbed so structures can stand on them.", "t": "Pile Driver; Pile Driver Operator; Pile Driving Operator", "pay": "about $73,300 (typical)", "entry": "High school diploma or equivalent; moderate-term on-the-job training. 89% of people doing this work have no degree", "out": "No individual BLS profile located"}, "47-2132.00": {"h": "You'd insulate pipes and ductwork so heating and cooling systems hold their temperature.", "t": "Commercial Insulator; Heat and Frost Insulator; Industrial Insulator", "pay": "about $58,340 (typical)", "entry": "High school diploma or equivalent", "out": "4-5 yr paid apprenticeship; some start as helpers"}, "47-2211.00": {"h": "You'd fabricate and install sheet metal — ducts, housings, drainpipes — cutting and forming it to fit.", "t": "Commercial Sheet Metal Service Installer; Field Installer; HVAC Sheet Metal Installer (Heating, Ventilation, and Air Conditioning Sheet Metal Installer)", "pay": "about $61,800 (typical)", "entry": "High school diploma or equivalent", "out": "4-5 yr apprenticeship; some start as helpers"}, "47-2221.00": {"h": "You'd raise and connect the steel that holds a building up, often high above the ground.", "t": "Field Iron Worker; Iron Worker; Ironworker", "pay": "about $62,780 (typical)", "entry": "On-the-job route may not require a high school nd test products to catch what's wrong before it reaches anyone.", "t": "Inspector; QA Auditor (Quality Assurance Auditor); QA Inspector (Quality Assurance Inspector)", "pay": "about $48,570 (typical)", "entry": "High school diploma or equivalent", "out": "about 69,900 openings a year"}, "51-9161.00": {"h": "You'd run computer-controlled machines that cut and shape metal and plastic to precise measurements.", "t": "CNC Gear Operator (Computer Numerical Control Gear Operator); CNC Lathe Operator (Computer Numerical Control Lathe Operator); CNC Machine Operator (Computer Numerical Control Machine Operator)", "pay": "about $50,690 (typical)", "entry": "High school diploma or equivalent; moderate-term on-the-job training. 79% of people doing this work have no degree", "out": "ladder to CNC programmer at $68,120"}, "51-9195.04": {"h": "You'd shape molten glass into form, by hand and by mold.", "t": "Bender; Gaffer; Glass Artist", "pay": "$34,950 to $61,050 (BLS reports this with molders, shapers and casters)", "entry": "High school diploma or equivalent; long-term on-the-job training — the skill is built on the job, not in a classroom. 74% of people doing this work have no degree", "out": "flagged Bright Outlook"}, "53-1043.00": {"h": "You'd supervise the crews and drivers who move material — the schedule, the loads, the safety.", "t": "Cargo Manager; DC Supervisor (Distribution Center Supervisor); Dock Supervisor", "pay": "about $62,890 (typical) (BLS reports this with transport and material-moving supervisors)", "entry": "High school diploma or equivalent; plus less than 5 years of related experience (BLS reports this with transport and material-moving supervisors)", "out": "about 54,900 openings a year"}, "53-2011.00": {"h": "You'd fly passengers or cargo on scheduled routes, sharing command of the aircraft.", "t": "Airbus Captain; Airline Captain; Airline Pilot", "pay": "$106,710 to $463,830 (OEWS 2025)", "entry": "Bachelor's degree plus experience as a commercial or up"}, "29-2043.00": {"h": "You'd give advanced emergency care at the scene — assessing, treating, and deciding fast under pressure.", "t": "Critical Care Paramedic; Firefighter Paramedic; First Responder", "pay": "about $60,600 (typical)", "entry": "Postsecondary nondegree award", "out": "no prior work experience required"}, "29-2042.00": {"h": "You'd be first on scene in an emergency — assessing injuries, giving basic care, and getting people to a hospital.", "t": "Emergency Medical Technician (EMT); First Responder", "pay": "about $44,470 (typical)", "entry": "Postsecondary nondegree award; EMT-Basic typically under 1 year", "out": "no prior work experience required"}, "21-2011.00-CH": {"h": "You'd sit with people in the worst hours of their lives — in hospitals, prisons, or the military — offering spiritual care to anyone, whatever they believe or don't.", "t": "Hospital Chaplain; Military Chaplain; Prison Chaplain; Hospice Chaplain; Corporate Chaplain", "pay": "about $60,810 (typical)", "entry": "Bachelor's degree; learned on the job over a few months", "out": "about 19,200 openings a year"}, "29-2061.00": {"h": "You'd give hands-on medical care — vitals, dressings, medications — and be the one who notices when something changes.", "t": "Licensed Practical Nurse (LPN); Licensed Vocational Nurse (LVN); Charge Nurse; Clinic Nurse; Home Health LPN", "pay": "about $64,400 (typical)", "entry": "Postsecondary nondegree award", "out": "about 51,800 openings a year"}};

catch(e){canSave=false;}

 try{localStorage.setItem(SK,JSON.stringify({i,A,bs}))}catch(e){canSave=false}}

function render(){
 save();
 pb.parentNode.style.visibility='visible';
 pb.style.width=(i/Q.length*100)+'%';
 if(i+1>deepest){deepest=i+1;track('q/reached-'+deepest,'Reached question '+deepest);}
 if(i>=Q.length){return results();}
 const q=Q[i];
 // Context moved out of the opening wall of text to the moment it's relevant.
 // Shown once each, the first time the person reaches that kind of question.
 const ASIDE={fr:"There are no wrong answers here, and nothing you say rules anything out. Saying a thing drains you doesn't close a door — it just marks the cost.",
   hob:"This counts as evidence too. What you do at home, for people you know, or for no reason at all, is as real as anything you've been paid for."};
 let aside='';
 if(ASIDE[q.k]&&!seenAside[q.k]){seenAside[q.k]=1;aside=`<div class="aside">${ASIDE[q.k]}</div>`;}
 let h=`<div class="sec">${q.s}<span class="prog">${i+1} of ${Q.length}</span></div>${aside}<h2>${q.t}</h2>`;
 let OPTS=q.o;
 if(q.dyn){const src=Q.find(x=>x.k===q.dyn);const picked=(A[q.dyn]||[]).filter(n=>src.hb&&src.hb[n]!=="");
  OPTS=picked.map(n=>src.o[n]);q._map=picked;
  if(!OPTS.length){i++;return render();}}
 if(q.multi)h+=`<div class="hint">${q.hint||'Pick everything that applies — there is no limit, and most people have several. Or none.'}</div>`;
 if(q.text){
  h+=`<textarea id="ta" rows="3" style="width:100%;padding:13px;border-radius:11px;border:1px solid #232741;background:#0c0f1c;color:#dfe3f0;font:15.5px ui-sans-serif;resize:vertical" placeholder="Optional — say as much or as little as you like">${A[q.k]||''}</textarea>`;
 }else if(q.pairs){
  q.o.forEach((p,n)=>{const[a,b]=p.split('|');
   h+=`<button class="opt${A['fr2_'+n]==='a'?' on':''}" data-p="${n}" data-v="a">${a}</button>
       <button class="opt${A['fr2_'+n]==='b'?' on':''}" data-p="${n}" data-v="b">${b}</button>
       <div style="height:10px"></div>`});
 }else{
  OPTS.forEach((o,n)=>{const lbl=Array.isArray(o)?o[0]:o;
   const on=q.multi?(A[q.k]||[]).includes(n):A[q.k||q.b+'_'+i]===n;
   h+=`<button class="opt${on?' on':''}" data-n="${n}">${lbl}</button>`});
 }
 const done=q.multi||q.pairs||q.text||A[q.k||q.b+'_'+i]!==undefined;
 h+=`<div class="nav">${i>0?'<button class="back">Back</button>':''}
     <button class="go" ${done?'':'disabled'}>${i===Q.length-1?'See your sky':'Next'}</button></div>`;
 app.innerHTML=h;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  if(q.text){
  h+=`<textarea id="ta" rows="3" style="width:100%;padding:13px;border-radius:11px;border:1px solid #232741;background:#0c0f1c;color:#dfe3f0;font:15.5px ui-sans-serif;resize:vertical" placeholder="Optional — say as much or as little as you like">${A[q.k]||''}</textarea>`;
 }else if(q.pairs){A['fr2_'+b.dataset.p]=b.dataset.v;}
  else if(q.multi){const k=q.k;A[k]=A[k]||[];const n=+b.dataset.n;
   const x=A[k].indexOf(n);x<0?A[k].push(n):A[k].splice(x,1);}
  else{const n=+b.dataset.n;A[q.k||q.b+'_'+i]=n;
   if(q.b){bs[q.b]+= (Array.isArray(q.o[n])?q.o[n][1]:0);}
   render();setTimeout(()=>{i++;render()},180);return;}
  render();});
 const ta=document.getElementById('ta');if(ta)ta.oninput=()=>{A[q.k]=ta.value};
 const g=app.querySelector('.go');if(g)g.onclick=()=>{i++;render()};
 const bk=app.querySelector('.back');if(bk)bk.onclick=()=>{i--;render()};

function results(){
 pb.style.width='100%';
 track('finished','Finished the quiz');
 Q.forEach(q=>{if(q.b)bmax[q.b]+=3});
 const norm={};Object.keys(bs).forEach(b=>norm[b]=bmax[b]?bs[b]/bmax[b]:0);
 // things they want kept as hobbies: cool those buckets, never remove
 const KQ=Q.find(x=>x.k==="keep"),HQ0=Q.find(x=>x.k==="hob");
 const keepB={};(A.keep||[]).forEach(j=>{const src=(KQ&&KQ._map)?KQ._map[j]:null;
   if(src==null)return;(HQ0.hb[src]||"").split(",").forEach(b=>{if(b)keepB[b]=1})});
 // hobbies feed buckets at lower weight than work evidence
 const HQ=Q.find(x=>x.k==="hob");
 const hobB={};
 (A.hob||[]).forEach(n=>{const m=HQ.hb[n];if(!m)return;
   m.split(",").forEach(b=>{hobB[b]=1;norm[b]=Math.min(1,(norm[b]||0)+0.06)});});
 // What they're learning: where attention is going now, rather than what they've
 // already done. Weighted a little above hobbies because it points forward.
 const LQ=Q.find(x=>x.k==="learn");
 (A.learn||[]).forEach(n=>{const m=LQ.hb[n];if(!m)return;
   m.split(",").forEach(b=>{norm[b]=Math.min(1,(norm[b]||0)+0.08)});});
 const SQ=Q.find(x=>x.k==="spark");
 (A.spark||[]).forEach(n=>{const m=SQ.hb[n];if(!m)return;
   m.split(",").forEach(b=>{norm[b]=Math.min(1,(norm[b]||0)+0.06)});});
 // pv3: what "mattering" looks like. Warms the buckets that deliver that kind of
 // mattering — below the weight of Pulls, which are direct evidence of what they enjoy.
 const PV3MAP={0:"B6",1:"B1",2:"B2,B5",3:"B3",4:"B1,B6",5:"B4,B2"};
 if(A.pv3!==undefined&&A.pv3!==null&&PV3MAP[A.pv3]){
   PV3MAP[A.pv3].split(",").forEach(b=>{norm[b]=Math.min(1,(norm[b]||0)+0.10)});
 }
 const order=Object.keys(norm).sort((a,b)=>norm[b]-norm[a]);
 const top=order[0],second=order[1],low=order[order.length-1];
 // friction dims the person cares about
 const fsel=(A.fr||[]).map(n=>FRICMAP[n]).filter(Boolean);
 // fr3: what they keep putting off. Real avoidance, so it counts as drain —
 // index 9 is "Nothing really", which maps to nothing.
 const FR3MAP={1:"Interpersonal intensity",2:"Conflict exposure",3:"Precision demand",
   5:"Interpersonal intensity",6:"Precision demand",8:"Interpersonal intensity"};
 (A.fr3||[]).forEach(n=>{const d=FR3MAP[n];if(d&&fsel.indexOf(d)<0)fsel.push(d);});
 // fr4: what actually made them miserable — lived evidence, not prediction.
 // Covers three things fr does not: no autonomy, underload, and meaninglessness.
 const FR4MAP={0:"Repetition",1:"Interpersonal intensity",2:"Autonomy",
   3:"Time pressure",6:"Time pressure"};
 (A.fr4||[]).forEach(n=>{const d=FR4MAP[n];if(d&&fsel.indexOf(d)<0)fsel.push(d);});
 // Two fr4 answers are wants, not drains: being underused means wanting more to do,
 // and work not mattering means wanting work that counts. They belong in the pull.
 const fr4w={};
 (A.fr4||[]).forEach(n=>{
   if(n===4)fr4w["Time pressure"]=1;                 // too little to do
   if(n===5)fr4w["Responsibility for others"]=1;     // didn't seem to matter
 });
 // what they said they WANT: dimension -> +1 drawn to the high end, -1 to the low end
 const want={};
 (A.env||[]).forEach(n=>{const e=ENVMAP[n];if(!e)return;
   want[e[0]]=(want[e[0]]||0)+(e[1]==="hi"?1:-1);});
 PAIRMAP.forEach((p,n)=>{const pick=A['fr2_'+n];if(!pick)return;
   const end=(pick==='a')?p[1]:p[2];
   want[p[0]]=(want[p[0]]||0)+(end==="hi"?1:-1);});
 Object.keys(fr4w).forEach(d=>{want[d]=(want[d]||0)+fr4w[d];});
 // don't let a dimension they also called draining be read as a want
 fsel.forEach(d=>{if(want[d]>0)delete want[d];});
 const wantKeys=Object.keys(want).filter(d=>want[d]!==0);
 // forced-choice work values: -1 drawn to the low end, +1 to the high end
 const wv={};
 // w3 and w6 list the HIGH end first, so their direction is flipped
 const WVFLIP={w3:1,w6:1};
 WVKEYS.forEach(k=>{const pick=A[k];if(pick===undefined||pick===null)return;
   let dir=(pick===0)?-1:1;
   if(WVFLIP[k])dir=-dir;
   wv[k]=dir;});
 const wvKeys=Object.keys(wv);
 // Resourcefulness: how much someone teaches themselves. Asymmetric by design —
 // a high score surfaces extra self-taught routes; a low score is never a penalty,
 // because not everyone has had the chance to find out.
 let resPts=0,resMax=0,aspir=0;
 ['res','res1','res3'].forEach(k=>{
   const q=Q.find(x=>x.k===k);if(!q)return;
   const pick=A[k];resMax+=3;
   if(pick===undefined||pick===null)return;
   const o=q.o[pick];if(!o)return;
   resPts+=o[1]||0;
   if(o[2])aspir++;            // "I haven't had the chance" — wanting counts, ability isn't claimed
 });
 const resFrac=resMax?resPts/resMax:0;
 // Things they told us that shouldn't move a score, but should come back to them.
 // These are for the person to carry into a real conversation about a real job.
 const CARRY=[];
 {const q=Q.find(x=>x.k==="pv4"),p=A.pv4;
  if(q&&p!=null&&q.o[p])CARRY.push(["You'd walk away from",(Array.isArray(q.o[p])?q.o[p][0]:q.o[p]).toLowerCase()+".",
    "Worth asking about before you take a job, not after."]);}
 {const q=Q.find(x=>x.k==="pv2"),p=A.pv2;
  if(q&&p!=null&&q.o[p]){const t=(Array.isArray(q.o[p])?q.o[p][0]:q.o[p]);
   if(p<=1)CARRY.push(["On who you'd work for",t.toLowerCase()+".",
     "That rules some employers out, not some jobs. Any of these stars can be done somewhere you'd stand behind."]);}}
 {const q=Q.find(x=>x.k==="faith"),p=A.faith;
  if(q&&p!=null&&p<=1&&q.o[p])CARRY.push(["On faith",(Array.isArray(q.o[p])?q.o[p][0]:q.o[p]).toLowerCase()+".",
    "No job here assumes anything about that. It's a question about employers and hours, and it's a fair one to ask."]);}
 {const q=Q.find(x=>x.k==="pv1"),picks=(A.pv1||[]).filter(n=>{const o=q&&q.o[n];return o&&!/None in particular/i.test(Array.isArray(o)?o[0]:o)});
  if(q&&picks.length)CARRY.push(["What pulls at you",
    picks.map(n=>(Array.isArray(q.o[n])?q.o[n][0]:q.o[n]).toLowerCase()).join(", ")+".",
    "You can serve any of these from most of the work below — as the job, or alongside it. Caring about something isn't the same as needing to do it for a living."]);}
 {const q=Q.find(x=>x.k==="money"),p=A.money;
  if(q&&p===0)CARRY.push(["On money","you need it to be the deciding factor right now.",
    "Pay ranges are shown where we have them. The top of a range is often years away from the bottom — worth reading both numbers."]);}
 // Aspiration (option B): saying "I haven't had the chance" is not evidence of skill,
 // so it never raises resFrac. But it is evidence about the person — it marks wanting,
 // and wanting should be able to pull a star into someone's sky. It widens the surprise
 // allowance rather than claiming an ability they didn't claim.
 const aspirBoost=aspir>0?Math.min(3,aspir):0;
 // gather roles from clusters in the top buckets
 // Someone who said "I haven't had the chance" gets a wider sky, not a smaller one:
 // one extra bucket opens up, so wanting can reach work their answers didn't prove.
 let pool=[];
 const REACH=Math.min(order.length,4+(aspirBoost>0?1:0));
 order.slice(0,REACH).forEach((b,bi)=>{
  Object.keys(DATA.clusters).filter(c=>c.startsWith(b+'|')).forEach(c=>{
   DATA.clusters[c].forEach(code=>{const r=DATA.roles[code];if(!r)return;
    var cl=c;
    let drain=0,fn=0;fsel.forEach(d=>{const v=r.fric[d];if(v===undefined||v===null)return;fn++;if(v>60)drain+=(v-60)/40});if(fn>0&&fn<fsel.length)drain=drain*fsel.length/fn;
    // attraction: reward roles that sit at the end of a dimension they said they want
    let pull=0,pn=0;
    wantKeys.forEach(d=>{const v=r.fric[d];if(v===undefined||v===null)return;pn++;
      const dir=want[d]>0?1:-1;
      const dist=dir>0?(v-50)/50:(50-v)/50;      // -1 .. 1
      pull+=Math.max(-1,Math.min(1,dist))*Math.min(2,Math.abs(want[d]));});
    if(pn>0&&pn<wantKeys.length)pull=pull*wantKeys.length/pn;
    const pullPts=pn?Math.max(-6,Math.min(9,pull*2.2)):0;
    // work-value alignment, deliberately weighted below pulls
    let wvs=0,wn=0;const cv=WVALS[code];
    if(cv)wvKeys.forEach(k=>{const v=cv[k];if(v===undefined)return;wn++;
      wvs+=wv[k]>0?(v-50)/50:(50-v)/50;});
    // residualised within job zone so preference can't import prestige
    const wvPts=wn?Math.max(-15,Math.min(15,(wvs/wn)*12)):0;
    // self-taught boost: only ever adds. resFrac<=0.5 contributes nothing at all.
    const openness=r.jz<=2?1:(r.jz===3?0.55:0);
    const resPtsRole=openness*Math.max(0,resFrac-0.5)*2*7;
    pool.push({code,r,b,bi,cl,drain,pull:pullPts,kept:!!keepB[b],
      wv:wvPts,score:r.fit-bi*4-(keepB[b]?6:0)+pullPts+wvPts+resPtsRole});});});});

 const seen={},stars=[];
 pool.sort((a,b)=>b.score-a.score).forEach(p=>{if(seen[p.code])return;seen[p.code]=1;stars.push(p)});
 // No-ceilings floor: a sky must always contain open-door work. The engine reserves
 // JZ1-2 slots when it builds the cards; scoring can push them back out, so re-reserve
 // here. Without this, roughly 1 in 15 skies came back with nothing reachable in them.
 const CAP=34,MINLOW=Math.round(CAP*0.25);
 const lowJZ=stars.filter(p=>p.r.jz<=2);
 let shown;
 if(lowJZ.length>=MINLOW){
   shown=stars.slice(0,CAP);
   let have=shown.filter(p=>p.r.jz<=2).length;
   if(have<MINLOW){
     const inShown={};shown.forEach(p=>inShown[p.code]=1);
     const spare=lowJZ.filter(p=>!inShown[p.code]);
     for(let k=shown.length-1;k>=0&&have<MINLOW&&spare.length;k--){
       if(shown[k].r.jz>2){shown[k]=spare.shift();have++;}
     }
     shown.sort((a,b)=>b.score-a.score);
   }
 } else shown=stars.slice(0,CAP);
 // surprise = from a bucket outside the person's top two
 shown.forEach(s=>{s.surprise=(s.b!==top&&s.b!==second);});
 draw(shown,top,second,low,fsel,CARRY,hobB,norm);
}

function nebulae(stars){
 // the strengths the sky is made of: clusters feeding the most stars
 const cnt={};stars.forEach(s=>{cnt[s.cl]=(cnt[s.cl]||0)+1});
 const top4=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,4);
 return top4.map(cl=>{
  const mine=stars.filter(s=>s.cl===cl);
  return {cl,skills:ELS[cl]||[],n:mine.length,mine};
 });
}

   <div class="xpp">Then keep going &mdash; ask what it left out, ask where it&rsquo;s unsure, ask it to be specific about your state. They sound confident even when they&rsquo;re wrong, especially about pay and licensing, so anything specific is worth checking against the state licensing board or bls.gov.</div>
