async function flush(key){
  if(!db){setSaved("Not saved in this view");return}
  if(writing[key])return;writing[key]=true;
  try{while(dirty[key]){dirty[key]=false;const body=bodyOf(key);if(!body)continue;const j=JSON.stringify(body);
      const path=pathOf(key);
      try{await db.doc(path).set(JSON.parse(j));lastJSON[key]=j;setSaved("Saved")}
      catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*700));try{await db.doc(path).set(JSON.parse(j));lastJSON[key]=j;setSaved("Saved")}catch(e2){setSaved("Couldn't save");toast("Couldn't save. Check your connection and try again.")}}
        else{setSaved("Couldn't save");toast(e&&e.code==="quota_exceeded"?"Storage is full. Delete old months to make room.":"Couldn't save that change.")}}}}
  finally{writing[key]=false}
}

function totals(items){let mine=0,v=0,byCat={};for(const it of items){if(!counts(it))continue;const m=monthly(it),mi=m*shr(it)/100;mine+=mi;v+=m-mi;byCat[it.cat]=(byCat[it.cat]||0)+mi}return{mine,v,all:mine+v,byCat}}
function incomeMonthly(){return ST().income.filter(i=>i.cad!=="once"&&i.amount!=null).reduce((a,i)=>a+i.amount*((INCADS.find(x=>x[0]===i.cad)||[0,0,12])[2])/12,0)}
function oneTime(){return ST().income.filter(i=>i.cad==="once"&&i.amount!=null&&!i.spent).reduce((a,i)=>a+i.amount,0)}
function debtMins(){return D().filter(c=>!c.payInFull).filter(c=>(c.balance||0)>0||(c.balance==null&&!c.paidOffOn)).reduce((a,c)=>a+(c.min||0),0)}
function flexPlanTotal(plan){plan=plan||ST().flexPlan;return FLEX.reduce((a,f)=>a+(plan[f[0]]||0),0)}

/* statement parsing */
function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}if(f!==""||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==""))}
function mapFlex(cat,desc){const s=(cat+" "+desc).toLowerCase();
  if(/grocer|wegmans|giant|safeway|aldi|instacart|whole foods|trader joe|harris teeter|food lion|costco/.test(s))return"groceries";
  if(/food|drink|restaurant|dining|coffee|starbucks|doordash|uber eats|grubhub|cafe|pizza|bar\b/.test(s))return"food";
  if(/gas|fuel|auto|transport|parking|toll|uber|lyft|car wash|shell|exxon|sunoco|wawa/.test(s))return"gas";
  if(/travel|airline|hotel|airbnb|flight|delta|united|southwest|american air|marriott|hilton/.test(s))return"travel";
  if(/health|pharm|cvs|walgreens|medical|wellness|personal|spa|salon|nail|wax|beauty|doctor|lab/.test(s))return"health";
  if(/entertain|movie|theater|ticket|concert|game|stream/.test(s))return"fun";
  if(/shop|merch|amazon|target|walmart|retail|clothing|home|best buy|apple store/.test(s))return"shopping";
  return"other"}
const SUBS=/netflix|hulu|spotify|apple\.com|itunes|prime|paramount|peacock|\bmax\b|hbo|disney|youtube|audible|adobe|dropbox|canva|openai|chatgpt|grammarly|claude|anthropic|patreon|uber one|dashpass|doordash|instacart|gym|fitness|membership|subscription|duolingo|icloud|siriusxm/i;
const norm=s=>s.toLowerCase().replace(/[#*]|\d{3,}|\b(pos|purchase|debit|recurring|online|www|com|inc|llc)\b/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" ");
function onList(name){const n=name.toLowerCase();return E().some(i=>{const w=i.name.toLowerCase().split(/[^a-z0-9+]+/).filter(x=>x.length>=4);return w.some(x=>n.includes(x))})}
function analyze(text,fileName){
  const rows=parseCSV(text);if(rows.length<2)throw new Error("empty");
  const h=rows[0].map(x=>x.trim().toLowerCase());const fi=re=>h.findIndex(x=>re.test(x));
  const ia=fi(/amount/),idsc=fi(/description|merchant|payee|name/),icat=fi(/category/),ity=fi(/^type$|transaction type/);
  if(ia<0||idsc<0)throw new Error("cols");
  const tx=[];for(const r of rows.slice(1)){const a=num(r[ia]);if(a==null||a===0)continue;const d=(r[idsc]||"").trim();const ty=ity>=0?(r[ity]||"").toLowerCase():"";tx.push({a,d,c:icat>=0?(r[icat]||""):"",ty})}
  const neg=tx.filter(t=>t.a<0).length,pos=tx.length-neg;const purchSign=neg>pos?-1:1;
  const buys=tx.filter(t=>Math.sign(t.a)===purchSign&&!/payment|credit|refund|return|adjustment/.test(t.ty)&&!/payment.*thank|autopay|online payment/i.test(t.d)).map(t=>({...t,a:Math.abs(t.a)}));
  const byFlex={};let total=0;const mer={};
  for(const t of buys){const f=mapFlex(t.c,t.d);byFlex[f]=Math.round(((byFlex[f]||0)+t.a)*100)/100;total+=t.a;const k=norm(t.d)||t.d;(mer[k]=mer[k]||{name:k,amounts:[]}).amounts.push(t.a)}
  const prevStmts=Object.values(S.months).filter(m=>m.statement&&m.id!==ciMonth).map(m=>m.statement);
  const flagged=[];for(const k in mer){const m=mer[k];if(onList(m.name))continue;const same=m.amounts.filter(a=>Math.abs(a-m.amounts[0])<0.01).length;let why="";
    if(same>=2)why=same+" charges of the same amount";else if(prevStmts.some(p=>(p.merchants||[]).some(x=>x.name===m.name&&Math.abs(x.amount-m.amounts[0])<=m.amounts[0]*0.15)))why="also charged last time you uploaded";else if(SUBS.test(m.name))why="looks like a subscription";
    if(why)flagged.push({name:m.name,amount:Math.round(m.amounts[0]*100)/100,why})}
  const merchants=Object.values(mer).map(m=>({name:m.name,amount:Math.round(m.amounts.reduce((a,b)=>a+b,0)/m.amounts.length*100)/100,count:m.amounts.length})).sort((a,b)=>b.amount*b.count-a.amount*a.count).slice(0,120);
  return{month:ciMonth,fileName,rows:buys.length,total:Math.round(total*100)/100,byFlex,flagged:flagged.slice(0,20),merchants}
}

function payoff(b,apr,p){if(!b||b<=0)return 0;if(!p||p<=0)return null;const r=(apr||0)/1200;if(r===0)return Math.ceil(b/p);if(p<=b*r)return Infinity;return Math.ceil(-Math.log(1-r*b/p)/Math.log(1+r))}

  ${zero.length?`<details class="card" style="padding:4px 14px"><summary>Paid off or $0 (${zero.length})</summary><div class="list" style="margin-bottom:10px">${zero.slice().sort((a,b)=>(b.paidOffOn?1:0)-(a.paidOffOn?1:0)).map(c=>`<button type="button" class="yr" data-act="debt-edit" data-id="${esc(c.id)}"><span class="y" style="color:var(--good)">${c.paidOffOn?"✓":"·"}</span><span style="min-width:0">${esc(c.name)}<span class="tiny ${c.paidOffOn?"up":"faint"}" style="display:block">${c.paidOffOn?"Paid off "+esc(c.paidOffOn)+(c.paidFrom?" · was "+money(c.paidFrom):""):esc(c.note||c.asof||"")}</span></span><span class="num">${money(0)}</span></button>`).join("")}</div></details>`:""}</div>`}

/* ---------- SALARY ---------- */
function latestSalary(){const s=Y().filter(y=>y.ptype==="salary"&&y.pay).sort((a,b)=>b.year-a.year);return s[0]||null}
function rSalary(){
  const ys=Y().slice().sort((a,b)=>a.year-b.year);const lat=latestSalary();
  const sal=ys.filter(y=>y.ptype==="salary"&&y.pay);const first=sal[0];
  const growth=first&&lat&&first!==lat?(lat.pay-first.pay)/first.pay*100:null;
  const rowsArr=ys.slice().reverse().map(y=>{const prev=ys.filter(p=>p.year<y.year&&p.ptype===y.ptype&&p.pay).pop();const ch=y.pay&&prev?(y.pay-prev.pay)/prev.pay*100:null;
    const est=y.ptype==="hourly"&&y.pay&&y.hours?y.pay*y.hours*52:null;
    const pay=y.ptype==="hourly"&&y.pay?money(y.pay)+"/hr":y.pay?money0(y.pay):y.ptype==="none"?"Unpaid":"—";
    return `<button type="button" class="yr" data-act="sal-edit" data-year="${y.year}"><span class="y">${y.year}</span><span style="min-width:0"><span style="font-weight:500">${esc(y.employer||"Employer not entered")}</span>${y.unsure?' <span class="chip st-unsure">Unsure</span>':""}<span class="tiny faint" style="display:block;overflow:hidden;text-overflow:ellipsis">${esc([y.title,y.jobs?y.jobs+(y.jobs>1?" jobs":" job"):"",y.taxable?"taxable "+money0(y.taxable):""].filter(Boolean).join(" · "))}</span>${y.ptype==="hourly"&&y.pay?`<span class="tiny" style="display:block;color:var(--ink-2)">${y.hours?`~${y.hours} hrs/wk ≈ ${money0(est)}/yr (estimate)`:esc(y.hoursNote||"Hours not entered")}</span>`:""}${y.otherPay?`<span class="tiny" style="display:block;color:var(--ink-2)">+ ${y.otherUnsure?"about ":""}${money0(y.otherPay)} ${esc(y.otherNote||"other jobs")} = <b>${y.otherUnsure?"~":""}${money0((y.pay||0)+y.otherPay)} combined</b></span>`:""}${y.note?`<span class="tiny faint" style="display:block">${esc(y.note)}</span>`:""}</span><span style="text-align:right"><span class="num" style="font-weight:600">${pay}</span>${ch!=null&&Math.abs(ch)>0.05?`<span class="chg ${ch>0?"up":"down"}" style="display:block">${pct(ch)}${prev.year!==y.year-1?" since "+prev.year:""}</span>`:""}</span></button>`});
  const rows=rowsArr.slice(0,4).join("");const older=rowsArr.slice(4);
  return `<div class="stack"><div class="hero"><div class="lab">Most recent base pay</div><div class="big num">${lat?money0(lat.pay):"—"}</div><div class="small muted">${lat?esc(lat.year+" · "+(lat.employer||"")):"Add a year with a salary"}${growth!=null?` · ${pct(growth)} since ${first.year} (${money0(first.pay)})`:""}</div>${(()=>{const c=ys.filter(y=>y.otherPay&&y.pay).sort((a,b)=>b.year-a.year)[0];return c?`<div class="small" style="margin-top:8px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--accent) 25%,transparent)">${c.year} combined, all jobs: <b class="num">${c.otherUnsure?"~":""}${money0(c.pay+c.otherPay)}</b> <span class="muted">(${money0(c.pay)} base + ${c.otherUnsure?"about ":""}${money0(c.otherPay)} ${esc(c.otherNote||"other jobs")})</span></div>`:""})()}</div>
  <div class="card"><div class="between"><h2>Pay over time</h2><span class="tiny faint">hollow dot = unsure</span></div>${salaryChart(ys)}</div>
  <section class="group"><h2 class="gh"><span>Offers to compare</span><button class="btn ghost sm" data-act="offer-add">Add offer</button></h2>${rOffers(lat)}</section>
  <section class="group"><h2 class="gh"><span>Year by year</span><button class="btn ghost sm" data-act="sal-add">Add year</button></h2><div class="list">${rows||`<div class="empty">No years yet.</div>`}</div>
  ${older.length?`<details style="margin-top:6px"><summary>Earlier years (${ys[0].year}–${ys[ys.length-5].year})</summary><div class="list">${older.join("")}</div></details>`:""}</section></div>`}
function salaryChart(ys){
  const pts=ys.filter(y=>(y.ptype==="salary"&&y.pay)||y.taxable);if(pts.length<2)return `<p class="small muted">Add at least two years with yearly pay to see the chart.</p>`;
  const x0=Math.min(...pts.map(p=>p.year)),x1=Math.max(...pts.map(p=>p.year));const vmax=Math.max(...pts.map(p=>Math.max(p.ptype==="salary"&&p.pay||0,p.taxable||0)));
  const top=Math.ceil(vmax/50000)*50000;const W=340,H=210,L=40,R=10,T=12,B=26;
  const X=y=>L+(x1===x0?0:(y-x0)/(x1-x0))*(W-L-R),Yv=v=>T+(1-v/top)*(H-T-B);
  let grid="";for(let v=0;v<=top;v+=50000){grid+=`<line x1="${L}" x2="${W-R}" y1="${Yv(v)}" y2="${Yv(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Yv(v)+3.5}" font-size="10" text-anchor="end">${v===0?"$0":"$"+v/1000+"k"}</text>`}
  let xl="";const step=(x1-x0)>8?2:1;for(let y=x0;y<=x1;y+=step)xl+=`<text x="${X(y)}" y="${H-8}" font-size="10" text-anchor="middle">${"'"+String(y).slice(2)}</text>`;
  const series=(get,color,label)=>{const s=ys.filter(y=>get(y)!=null);if(!s.length)return"";let d="",segs="";for(let i=1;i<s.length;i++){const a=s[i-1],b=s[i];segs+=`<line x1="${X(a.year)}" y1="${Yv(get(a))}" x2="${X(b.year)}" y2="${Yv(get(b))}" stroke="${color}" stroke-width="2.2" ${b.year-a.year>1?'stroke-dasharray="4 4"':""} stroke-linecap="round"/>`}
    const dots=s.map(y=>`<circle cx="${X(y.year)}" cy="${Yv(get(y))}" r="3.6" fill="${y.unsure?"var(--surface)":color}" stroke="${color}" stroke-width="1.8"><title>${y.year} ${label}: ${money0(get(y))}${y.unsure?" (unsure)":""}</title></circle>`).join("");
    const last=s[s.length-1];const below=label==="main-job salary";return segs+dots+`<text x="${X(last.year)-4}" y="${Yv(get(last))+(below?16:-8)}" font-size="10.5" text-anchor="end" style="fill:${color};font-weight:600">${money0(get(last))}</text>`};
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Main job salary and taxable income by year">${grid}${xl}
  ${series(y=>y.taxable||null,"var(--c5)","taxable income")}${series(y=>y.ptype==="salary"&&y.pay?y.pay:null,"var(--accent)","main-job salary")}</svg>
  <div class="row tiny muted" style="gap:14px;flex-wrap:wrap"><span class="row" style="gap:5px"><i style="width:14px;height:3px;background:var(--accent);display:inline-block;border-radius:2px"></i>Main-job salary</span><span class="row" style="gap:5px"><i style="width:14px;height:3px;background:var(--c5);display:inline-block;border-radius:2px"></i>Taxable income</span><span>dashed = years missing between</span></div>`}
function hourlyChart(ys){const h=ys.filter(y=>y.ptype==="hourly"&&y.pay);if(!h.length)return"";const mx=Math.max(...h.map(y=>y.pay))*1.2;const W=340,H=120,bw=(W-20)/h.length;
  return `<div class="card"><div class="between"><h2>Hourly years</h2><span class="tiny faint">not converted to yearly</span></div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Hourly pay by year">${h.map((y,i)=>{const x=10+i*bw+bw*.22,w=bw*.56,hh=y.pay/mx*(H-40);return `<rect x="${x}" y="${H-20-hh}" width="${w}" height="${hh}" rx="4" fill="${y.unsure?"var(--accent-soft)":"var(--accent)"}" stroke="var(--accent)" stroke-width="1.2" ${y.unsure?'stroke-dasharray="3 3"':""}/><text x="${x+w/2}" y="${H-24-hh}" font-size="10.5" text-anchor="middle">${money(y.pay)}</text><text x="${x+w/2}" y="${H-6}" font-size="10" text-anchor="middle">${y.year}</text>`}).join("")}</svg><p class="tiny faint" style="margin:0">Dashed bars are rates you marked unsure.</p></div>`}
const thRate=()=>ST().takeHome;
function monthlyNeed(){return totals(E()).mine+debtMins()+flexPlanTotal()}
function rOffers(lat){const os=O();if(!os.length)return `<div class="card small muted">No offers yet. Add one to see how its base pay compares with ${lat?money0(lat.pay):"your latest salary"}.</div>`;
  return `<div class="list">${os.map(o=>{const d=lat&&o.base?o.base-lat.pay:null;const p=d!=null?d/lat.pay*100:null;return `<button type="button" class="yr" data-act="offer-edit" data-id="${esc(o.id)}"><span class="y" style="font-size:13px">${esc((o.company||"?").slice(0,4))}</span><span style="min-width:0"><span style="font-weight:500">${esc(o.company||"Company")}</span><span class="tiny faint" style="display:block">${esc([o.title,o.bonus?"bonus: "+o.bonus:"",o.note].filter(Boolean).join(" · "))}</span>${o.base&&(o.takeHome!=null||thRate()!=null)?(()=>{const th=o.takeHome!=null?o.takeHome:o.base*thRate()/100/12;const left=th-monthlyNeed();return `<span class="tiny" style="display:block;color:var(--ink-2)">≈ ${money0(th)}/mo take-home${o.takeHome!=null?"":" (estimate)"} · leaves <b class="${left<0?"down":"up"}">${left<0?"−":""}${money0(Math.abs(left))}/mo</b></span>`})():""}</span><span style="text-align:right"><span class="num" style="font-weight:600">${money0(o.base)}</span>${p!=null?`<span class="chg ${d>=0?"up":"down"}" style="display:block">${d>=0?"+":"−"}${money0(Math.abs(d))} · ${pct(p)}</span>`:""}</span></button>`}).join("")}</div><p class="tiny faint">Compared with ${lat?money0(lat.pay)+" ("+lat.year+")":"—"}. Base pay only; benefits and bonus aren't included in the %.</p><p class="tiny faint">${thRate()!=null?`Take-home is estimated at ${thRate()}% of base${ST().takeHomeNote?" ("+esc(ST().takeHomeNote)+")":""}.`:`Set your take-home rate in Settings to estimate monthly pay after taxes and benefits, or enter an offer's real take-home.`} "Leaves" subtracts your monthly need: your share of expenses, card minimums and everyday spending plan (${money0(monthlyNeed())}/mo). Change the rate under Income, goals and backup, or enter an offer's real take-home.</p>`}

let sheetCb=null,sheetReturn=null;
function openSheet(o){if(!sheetCb)sheetReturn=document.activeElement;sheetCb=o;const v=o.values||{};
  const f=o.fields.map(x=>{const id="f_"+x.k;const val=v[x.k];let inp;
    if(x.type==="select")inp=`<select id="${id}">${x.opts.map(p=>`<option value="${esc(p[0])}" ${String(val)===String(p[0])?"selected":""}>${esc(p[1])}</option>`).join("")}</select>`;
    else if(x.type==="textarea")inp=`<textarea id="${id}" placeholder="${esc(x.ph||"")}">${esc(val??"")}</textarea>`;
    else if(x.type==="check")inp=`<label class="row small"><input type="checkbox" id="${id}" ${val?"checked":""}> ${esc(x.cl||"")}</label>`;
    else inp=`<input id="${id}" ${x.type==="number"?'inputmode="decimal"':x.type==="date"?'type="date"':x.type==="month"?'type="month"':""} value="${esc(val??"")}" placeholder="${esc(x.ph||"")}">`;
    return `<div class="field ${x.full?"full":""}">${x.type==="check"?"":`<label for="${id}">${esc(x.label)}</label>`}${inp}${x.help?`<span class="help">${esc(x.help)}</span>`:""}<span class="help" id="${id}_err" style="color:var(--bad)"></span></div>`}).join("");
  $("#sheetRoot").innerHTML=`<div class="sheet-bg" data-sheet-bg><form class="sheet" id="sheetForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate><div class="between"><h2 id="sheetTitle">${esc(o.title)}</h2><button type="button" class="iconbtn" data-sheet-close aria-label="Close">✕</button></div><div class="fgrid">${f}</div>
   <div class="btns" style="justify-content:space-between">${o.onDelete?`<span>${o.confirmDel?`<button type="button" class="btn sm" data-sheet-del style="color:var(--bad);border-color:var(--bad)">Yes, delete</button>`:`<button type="button" class="btn ghost sm" data-sheet-askdel style="color:var(--bad)">Delete</button>`}</span>`:"<span></span>"}<span class="btns">${o.extra?`<button type="button" class="btn" data-sheet-extra style="color:var(--good);border-color:var(--good)">${esc(o.extra.label)}</button>`:""}<button type="button" class="btn" data-sheet-close>Cancel</button><button type="submit" class="btn pri">${esc(o.saveLabel||"Save")}</button></span></div></form></div>`;
  const first=$("#sheetForm input,#sheetForm select,#sheetForm textarea");if(first)setTimeout(()=>first.focus(),30)}
function closeSheet(){$("#sheetRoot").innerHTML="";sheetCb=null;const r=sheetReturn;sheetReturn=null;setTimeout(()=>{if(r&&document.contains(r))r.focus()},0)}
$("#sheetRoot").addEventListener("click",e=>{if(e.target.matches("[data-sheet-bg]")||e.target.closest("[data-sheet-close]"))closeSheet();
  else if(e.target.closest("[data-sheet-askdel]")){const o=sheetCb;const vals=collect(o);openSheet({...o,values:{...o.values,...vals},confirmDel:true})}
  else if(e.target.closest("[data-sheet-del]")){const o=sheetCb;closeSheet();o.onDelete();render()}
  else if(e.target.closest("[data-sheet-extra]")){const o=sheetCb;closeSheet();o.extra.fn();render()}});
$("#sheetRoot").addEventListener("submit",e=>{e.preventDefault();const o=sheetCb;if(!o)return;const v=collect(o);
  for(const x of o.fields){const el=$("#f_"+x.k+"_err");if(el)el.textContent="";if(x.req&&(v[x.k]==null||v[x.k]==="")){el.textContent="Enter "+x.label.toLowerCase()+" first.";return}if(x.type==="number"&&$("#f_"+x.k).value.trim()!==""&&v[x.k]==null){el.textContent="Enter a number, like 125.50";return}}
  closeSheet();o.onSave(v);render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetCb)closeSheet()});
function collect(o){const v={};for(const x of o.fields){const el=$("#f_"+x.k);if(!el)continue;v[x.k]=x.type==="check"?el.checked:x.type==="number"?num(el.value):el.value.trim()}return v}

async function doXlsx(){
  let X;try{toast("Building the spreadsheet…");X=await loadScript(XLSXJS,"XLSX")}catch(e){toast("Couldn't load the spreadsheet tool. Check your connection.");return}
  const wb=X.utils.book_new();const add=(name,rows)=>{const ws=X.utils.json_to_sheet(rows.length?rows:[{Note:"Nothing here yet"}]);const keys=Object.keys(rows[0]||{Note:1});ws["!cols"]=keys.map(k=>({wch:Math.min(40,Math.max(k.length,...rows.map(r=>String(r[k]??"").length))+2)}));X.utils.book_append_sheet(wb,ws,name)};
  add("Expenses",E().map(i=>({Name:i.name,Category:catName(i.cat),Status:STATUS[i.status][0],"Amount per bill":i.amount,"How often":cadLabel(i.cad),...(SPL().on?{"Your share %":shr(i)}:{}),"Your monthly":Math.round(mineM(i)*100)/100,"Due day":i.dueDay||"","Due month":i.due?MONTHS[i.due-1]:"","Paid with":i.method||"",Ends:i.ends||"",Note:i.note||""})));
  add("Debt",D().map(c=>({Card:c.name,Balance:c.balance,"APR %":c.apr,Minimum:c.min,"Paying monthly":c.pay,"Pays in full":c.payInFull?"Yes":"",Statement:c.statement,"As of":c.asof||"","Paid off":c.paidOffOn||"",Note:c.note||""})));
  const ci=[];Object.values(S.months).filter(m=>m.started).sort((a,b)=>a.id.localeCompare(b.id)).forEach(m=>[...CATS,...FLEX].forEach(c=>ci.push({Month:monthLabel(m.id),Category:c[1],Planned:Math.round(((m.planned[c[0]]||0)+(m.carry&&m.carry[c[0]]||0))*100)/100,Actual:m.actual[c[0]]??""})));add("Check-ins",ci);
  const by=histMonths();add("Trends",Object.keys(by).sort().map(m=>{const r={Month:monthLabel(m)};BUCKETS.forEach(b=>r[bucketName(b)]=Math.round((by[m][b]||0)*100)/100);return r}));
  add("Payments received",ST().incomeLog.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(x=>({Date:x.date,Source:x.source,Amount:x.amount,Note:x.note||""})));
  add("Savings goals",ST().savings.map(g=>({Goal:g.name,Target:g.target,Saved:g.saved||0,"Reach by":g.by||""})));
  if(!ST().bizOff){const bz=[];Object.values(BZ().years).forEach(y=>(y.items||[]).forEach(i=>bz.push({Year:y.year,Group:i.group,Item:i.name,Cost:i.cost,"Business-use %":i.pct,Receipt:i.receipt?"Yes":"",Purpose:i.purpose||"",Note:i.note||""})));add("Business",bz)}
  const out=X.write(wb,{type:"array",bookType:"xlsx"});
  try{await saveFile("budget-book-"+today.toISOString().slice(0,10)+".xlsx",new Uint8Array(out));toast("Spreadsheet saved")}catch(e){if(e&&e.code!=="declined")toast("Couldn't save the spreadsheet.")}}

- Overview: my share of bills per month with a color bar by category, a month card (income minus bills, card minimums and an everyday spending plan), and upcoming dates.
- Expenses: my bills and subscriptions with amount, how often, due day and category. A switch to pause one, a circle to tick it paid each month, and a calendar view where I can look at other months.
- Check-in and Trends: once a month, compare planned vs. actual spending. Let me upload card files (CSV, PDF or screenshot) to see spending by category and top places.
- Money: income and payments received, credit card debt with a payoff order, savings goals, and salary history.
- Settings: optional bill splitting with a partner or roommate, rename categories, hide tabs, download as Excel, and backup.

How it should work:
- Save my data privately so only I can see it, kept between visits.
- Easy to use on my phone, with Light and Dark mode.

How to work with me:
- Ask me one or two questions at a time before you build.
- Show me the plan and wait for my OK.
- Never fill in numbers I haven't given you. If you're unsure, label it.

I'll start by sharing my bills, cards and income: [attach a spreadsheet, a screenshot, or type a list here].`;

  const apply=(key,snap)=>{loaded[key]=true;if(key==="expenses")booting=false;if(!snap.exists){render();return}const j=JSON.stringify(snap.data());if(j===lastJSON[key]||dirty[key]||writing[key])return;lastJSON[key]=j;
    if(key.startsWith("m:"))S.months[key.slice(2)]=JSON.parse(j);else if(key.startsWith("h:"))HM()[key.slice(2)]=JSON.parse(j);else S[key]=JSON.parse(j);if(!(adjust&&key==="expenses"))render()};
