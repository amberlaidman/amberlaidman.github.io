<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--sage:#6E7A72; --cream:#EAE4D9; --mint:#9CC8BE; --white:#FBFAF7;
--oak:#C9A46C; --ink:#2C2822; --ink2:#6A625A; --accent:#C4623C;
}
body{background:#DDD6CA;min-height:100vh;
font-family:'Space Grotesk',system-ui,-apple-system,sans-serif}
.about-scene-wrap{display:flex;align-items:center;justify-content:center;padding:clamp(30px,5vw,60px) clamp(8px,2.5vw,14px)}
.wrap{width:100%;max-width:min(960px,100%)}
.scene{position:relative;border-radius:clamp(10px,2vw,16px);overflow:hidden;background:var(--cream);
box-shadow:0 3px 8px rgba(44,40,34,.10),0 18px 54px rgba(44,40,34,.20);line-height:0}
.scene svg{width:100%;height:auto;display:block}
.hs:hover .olab,.hs.on 
.hs{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transform-box:fill-box;transform-origin:center bottom;
transition:transform .26s cubic-bezier(.34,1.5,.64,1),opacity .3s}
@media (hover:hover) and (pointer:fine){
.hs:hover{transform:translateY(-6px) scale(1.04)}
}
.hs.on{transform:translateY(-4px) scale(1.03)}
.hs:focus-visible{outline:none}
.hs:focus-visible .hs-ring{opacity:1;stroke-width:2.6;stroke-dasharray:none}
.hs-ring{fill:rgba(196,98,60,.10);stroke:var(--accent);stroke-width:1.8;opacity:0;
transition:opacity .2s;pointer-events:none}
.hs:hover .hs-ring{opacity:.55}
.hs.on .hs-ring{opacity:1;fill:rgba(196,98,60,.16)}
.hs-dot{fill:var(--accent);opacity:.42;transition:opacity .25s,r .25s}
.hs:hover .hs-dot{opacity:1}
.hs.on .hs-dot{opacity:0}
.hs.seen .hs-dot{fill:#4E6448;opacity:.7}
.hs.seen:hover .hs-dot{fill:var(--accent);opacity:1}
.scene.focused .hs:not(.on){opacity:.34}
.scene.focused .hs:not(.on):hover{opacity:1}
.scene.focused .dimmable{opacity:.42;transition:opacity .3s}
.scene.hint .hs-dot{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35;r:2.6}50%{opacity:.9;r:4.2}}
/* Placard-as-hotspot — gentler hover than the small objects */
.hs.wall-placard:hover{transform:translateY(-2px) scale(1.005)}
.hs.wall-placard.on{transform:translateY(-1px) scale(1.005)}
.scene.focused .hs.wall-placard:not(.on){opacity:.55}
.nudge{position:absolute;left:50%;bottom:clamp(7px,2vw,12px);transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;
background:rgba(44,40,34,.9);color:var(--white);font-size:clamp(9px,2.2vw,10px);font-weight:600;
padding:clamp(6px,1.6vw,7px) clamp(11px,3vw,15px);border-radius:20px;display:flex;align-items:center;gap:8px;
white-space:nowrap;box-shadow:0 4px 16px rgba(44,40,34,.3);transition:opacity .4s;
pointer-events:none;line-height:1}
.nudge b{color:var(--accent)}
.nudge-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pl2 2s ease-in-out infinite}
@keyframes pl2{0%,100%{opacity:.4}50%{opacity:1}}
.scene:not(.hint) .nudge{opacity:0}
.panel{background:var(--white);padding:clamp(13px,3vw,18px) clamp(14px,3.5vw,22px);min-height:clamp(120px,26vw,150px);
border-top:1px solid rgba(44,40,34,.08);line-height:1.5}
.p-empty-sub{font-size:11.5px;font-style:normal;opacity:.72}
.p-empty{font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;font-style:normal;font-size:clamp(13px,3vw,15px);color:var(--ink2);line-height:1.7}
.p-kick{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#2E5461;margin-bottom:8px}
.p-title{font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;font-size:clamp(.98rem,3vw,1.1rem);font-weight:600;color:var(--ink);margin-bottom:6px}
.p-body{font-size:clamp(11.5px,2.6vw,12.5px);color:var(--ink2);line-height:1.75;max-width:680px}
.toggle{background:none;border:1px solid rgba(44,40,34,.18);border-radius:20px;
padding:6px 14px;font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;font-size:9.5px;font-weight:700;
letter-spacing:.14em;text-transform:uppercase;color:#4A443C;cursor:pointer;transition:.2s}
.toggle:hover{background:var(--ink);color:var(--white);border-color:var(--ink)}
.list{display:none;margin-top:14px;background:var(--white);border-radius:12px;padding:18px 22px}
.list.show{display:block}
.list h3{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#2E5461;margin:14px 0 9px}
.list h3:first-child{margin-top:0}
.list dl{display:grid;grid-template-columns:auto 1fr;gap:7px 18px}
.list dt{font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.list dd{font-size:11.5px;color:var(--ink2);line-height:1.65}
@media(max-width:640px){.list dl{grid-template-columns:1fr;gap:2px}.list dd{margin-bottom:9px}}
@media (prefers-reduced-motion: reduce){
*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
.hs:hover,.hs.on{transform:none}
}
.modal-backdrop{position:fixed;inset:0;background:rgba(44,40,34,.62);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s;z-index:100;backdrop-filter:blur(2px)}
.modal-backdrop.on{opacity:1;visibility:visible}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-45%);background:var(--white);border-radius:14px;padding:clamp(24px,5vw,40px);width:min(560px,92vw);max-height:82vh;overflow-y:auto;box-shadow:0 24px 60px rgba(44,40,34,.35);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s,transform .22s;z-index:101}
.modal.on{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
.modal:focus{outline:none}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:24px;line-height:1;cursor:pointer;color:var(--ink2);padding:8px 12px;border-radius:6px;transition:.15s}
.modal-close:hover{background:rgba(44,40,34,.08);color:var(--ink)}
.modal-close:focus-visible{outline:2px solid #2E5461;outline-offset:2px}
.modal-kick{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#2E5461;margin-bottom:8px}
.modal-title{font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(19px,4vw,22px);font-weight:600;color:var(--ink);margin:0 0 14px;line-height:1.2;padding-right:32px}
.modal-body{font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(13.5px,3vw,14.5px);line-height:1.7;color:var(--ink2)}
.tools{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.tools-note{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#7A7268}
@media (max-width:900px){
.hs-dot{opacity:.55}
.scene.hint .hs-dot{animation-duration:2s}
}
@media (max-width:620px){
.hs-dot{opacity:.65}
@keyframes pl{0%,100%{opacity:.5;r:3.4}50%{opacity:1;r:5.4}}
.hs-ring{stroke-width:2.6}
.list dl{grid-template-columns:1fr;gap:2px}
.list dd{margin-bottom:10px}
}
@media (max-width:420px){
.hs-dot{opacity:.72;r:3.4}
.hs-ring{stroke-width:3}
.nudge{white-space:normal;text-align:center;max-width:88%}
}

<script>
const DATA={
 about:{k:'About',t:'Amber Laidman',b:'<p style="font-style:italic;font-size:15px;color:#3A342E;margin:0 0 22px;line-height:1.55">Always curious. I think about learning the way I think about any experience worth having &mdash; every part matters, and so does how they fit together.</p><p style="margin:0 0 16px">My work has been shaped by years in retail, customer service, and other frontline roles. That background changes how I design: learning has to feel worth showing up for, and it has to work in real jobs, on busy days, with real time pressure.</p><p style="margin:0 0 16px">I approach it holistically &mdash; the person using it comes first, the whole thing gets thought through, and it&rsquo;s built to keep working as the team, the audience, or the size of it changes.</p><p style="margin:0 0 4px">Wherever life is happening is where I want to be. The rest is portable.</p><p style="margin-top:24px;padding-top:18px;border-top:1px solid #D8CEBA;font-weight:500;color:#2E5461">There&rsquo;s more in the room. Select anything to explore.</p>'},
 diploma:{k:'Chapter I · Foundation',t:'Where it starts',b:'Graduated high school at 16 and went straight into college — already working the whole time. There was never a version of this where school and work happened separately. Doing both at once became the default early, and it stuck.'},
 invoices:{k:'Chapter I · Foundation',t:"My dad's invoices",b:'Once we got a computer, I helped my dad with the invoices for his small business — the same thing my mom did for him. That\'s how I learned the paperwork side of running something. It\'s also where I learned to take the small jobs. He never turned down a little one, because small clients still pay the bills and they\'re the ones who refer you. That business took care of our family.'},
 grocery:{k:'Chapter I · Foundation',t:'Grocery',b:'Cashier, deli, food service, customer service — a stack of different roles in the same building. Retail work gets flattened into "you were a cashier," but the actual lesson was range: every counter had its own rhythm, its own regulars, its own way things could go wrong. I still put away carts when I see them loose in a lot.'},
 guest:{k:'Chapter I · Foundation',t:'Guest experience',b:'Gap and Target, where the word wasn\'t customer — it was guest. That\'s not a branding trick. Someone in your store is a guest in that space, and your job is to figure out what they actually need, not just ring them up. Folding and presentation mattered, but the real skill was reading the person in front of you and right-fitting them to what they came in for. It was my first introduction to selling, without a single commission attached.'},
 studio:{k:'Chapter I · Foundation',t:'Sears Portrait Studio',b:'The first time photography was a job and not a hobby. Sessions on a clock, families who didn\'t want to be there, kids who wouldn\'t sit still — and you still had to come out with something they\'d want to keep. Then you sold them the package.'},
 earlyreads:{k:'Chapter I · Foundation',t:'Early reads',b:'Been reading since I was little and never stopped. 1984, Go Ask Alice, Cut — a few from the high school stack. Formal tracking didn\'t start until 2016; 550 books later, it\'s still going.'},
 camera:{k:'Chapter I · Foundation',t:'The camera',b:'Fell in love with photography in middle school. Got a camera, started taking pictures, and that was that. People were always the subject — still are — though lately it\'s been travel and architecture.'},

 aa:{k:'Chapter II · Craft &amp; Ownership',t:'Harford Community College',b:'Associate\'s in photography, 2009. Probably my most creative stretch — the work was the point, and I met some of my closest friends there, the ones I still have.'},
 bs:{k:'Chapter II · Craft &amp; Ownership',t:'BS Photography — Towson',b:'Continued straight into the bachelor\'s. One of the harder stretches of my life, but I finished it. Then went right back to work after — I wasn\'t chasing a dream job, I was focused on stability. That came first.'},
 aavw:{k:'Chapter II · Craft &amp; Ownership',t:'A&amp;A Visual Works',b:'The brand my friend and I built — portraits mostly, engagements and proposals, the occasional event, plus real estate, drone work, travel, and architecture. Running it meant client conversations, contracts, invoices, and licensing, not just showing up with a camera.'},
 tmobile:{k:'Chapter II · Craft &amp; Ownership',t:'T-Mobile — twelve years',b:'Started on the sales floor as a Mobile Expert in 2011 and left in 2023 as a Field Training Manager. Retail Associate Manager, District Trainer, Sr. Sales Trainer along the way. I didn\'t set out to work in L&amp;D — I found it by training the people around me and realizing that was the part I liked most. Fourteen PEAK nominations and two Quarterly Winner\'s Circle awards over those years, from mobile experts to market directors, plus six Circle of Achievement nominations at Sprint.'},
 dei:{k:'Chapter II · Craft &amp; Ownership',t:'DEI Council',b:'Co-led the local Maryland/Delaware chapter from 2021 to 2023. After a restructure, the chapter needed rebuilding — starting with whoever was still in and what they could realistically commit to, then building relationships across retail, government affairs, legal, and advertising to give it footing again.'},
 reading:{k:'Chapter II · Craft &amp; Ownership',t:'The reading shelf',b:'Started listening to audiobooks in 2023, and it changed everything — about 78% of what I read now is audio, and the yearly count went from 27 books to over 100. The Overstory, Razorblade Tears, The Violin Conspiracy, The Cartographers, Lessons in Chemistry — five stars, 2023 to now.'},

 ms:{k:'Chapter III · L&amp;D Leadership',t:'MS — Learning Design &amp; Technology',b:'Master of Science in Learning Design &amp; Technology, University of Maryland.'},
 cert:{k:'Chapter III · L&amp;D Leadership',t:'Graduate Certificate — Project Management',b:'Graduate certificate in Project Management at University of Maryland, in progress — expected March 2027.'},
 outdoorsy:{k:'Chapter III · L&amp;D Leadership',t:'Outdoorsy',b:'Learning Development Consultant, early 2024. Converted the e-learning library from Absorb to Articulate Rise — 22 new courses — and rewrote the 2024 new hire curriculum to better support facilitators. Recruit success rate went from 76% in 2023 to 86% in 2024. Also ran the seasonal onboarding events for 105 new customer support agents.'},
 southwest:{k:'Chapter III · L&amp;D Leadership',t:'Southwest Airlines',b:'Learning Developer intern on the TechOps team, summer 2024. Built eight Rise courses for supervisors auditing 100+ stations, and a course catalog tracking the 85 courses provided to vendors — used for monthly audits against both the company and vendor LMS.'},
 visa:{k:'Chapter III · L&amp;D Leadership',t:'Visa',b:'Sr. Consultant, Training &amp; Development — content and instructional design for Visa\'s Risk and Identity solutions. Led onboarding for new Risk Solutions Services team members, and worked across a global team on a flexible schedule. Also ran off-cycle training for the product and sales engineering teams.'},
 travel:{k:'Chapter III · Personal',t:'Travel',b:'Didn\'t really start until 2017, when I met my partner. Japan, Ireland, Italy, Iceland, Spain, Portugal, Morocco, the Philippines, Singapore, Korea since then. It\'s where the photography went from portraits to architecture — and where the Japanese and Spanish study came from.'},
 floralwall:{k:'The room',t:'Floral work',b:'I take frames and found objects and build arrangements into them — all artificial florals. It\'s something I picked up and genuinely love doing. Mostly it\'s soothing: figure out what belongs in the frame and what doesn\'t, and take as long as it takes.'},
 floral:{k:'Chapter III · Personal',t:'Floral work',b:'I take frames and found objects and build arrangements into them — all artificial florals. It\'s something I picked up and genuinely love doing. Mostly it\'s soothing: figure out what belongs in the frame and what doesn\'t, and take as long as it takes.'},
 home:{k:'Chapter III · Personal',t:'Home',b:'Found my person in 2017. Still going, still new every day — still learning each other, still growing with each other. Wherever we are, that\'s home.'},
 mdhall:{k:'Chapter III · Personal',t:'Maryland Hall',b:'Started volunteering a little over a year ago, mostly with teaching and arts units — supporting the teaching staff, and making sure students get to their classes safely.'},

 medals:{k:'The room',t:'The medal rack',b:'Started running in 2011. 5Ks up through half marathons since then. I love it — it\'s therapeutic and freeing, and I genuinely enjoy the training part, for myself.'},
 imac:{k:'The room',t:'The iMac',b:'My best working space, for art and for the day to day. I\'m fully Mac for my own work — though the business world runs on Windows, and I move between both without much fuss.'},
 headphones:{k:'The room',t:'Headphones',b:'Over-the-ear, in-ear, or just open on the device — depends on the day. I like having options. The only rule is wireless, because I\'m not staying in one place.'},
 chair:{k:'The room',t:'The saddle chair',b:'I can\'t sit still. The saddle chair and the standing desk exist because I need to be able to shift, stand, move, and get up without breaking focus. Designing for how people actually work applies to my own setup too.'},
 tools:{k:'The room',t:'The tool jar',b:'Everything I work in day to day. Articulate Rise 360, iSpring, Canva, Google Workspace, Microsoft 365, Adobe Creative Cloud, Miro, Claude, and OpenAI. Industries: telecom, travel and hospitality, spirits, contact center operations.'},
 cliffs:{k:'The room',t:'Cliffs, framed',b:'A photo I took, framed and hanging. One of the ones I keep looking at &mdash; the reason the photography moved from portraits toward landscape and architecture. Somewhere on a coast, on a trip that made me want to keep going.'}
};

const scene=document.getElementById('scene');
const modalEl=document.getElementById('modal'),modalBackdrop=document.getElementById('modalBackdrop');
const modalKick=document.getElementById('modalKick'),modalTitle=document.getElementById('modalTitle'),modalBody=document.getElementById('modalBody'),modalClose=document.getElementById('modalClose');
const trackerCount=document.getElementById('trackerCount');
const seen=new Set();
let lastFocused=null;

function updateTracker(){
  if(trackerCount) trackerCount.textContent=seen.size;
}

function show(k){
  const d=DATA[k]; if(!d)return;
  document.querySelectorAll('.hs').forEach(e=>e.classList.remove('on'));
  const el=document.querySelector('.hs[data-k="'+k+'"]');
  el.classList.add('on');
  el.classList.add('seen');
  seen.add(k);
  updateTracker();
  scene.classList.remove('hint');
  scene.classList.add('focused');
}
function openModal(k){
  const d=DATA[k]; if(!d)return;
  lastFocused=document.activeElement;
  modalKick.innerHTML=d.k;
  modalTitle.innerHTML=d.t;
  modalBody.innerHTML=d.b;
  modalBackdrop.classList.add('on');
  modalEl.classList.add('on');
  document.body.style.overflow='hidden';
  setTimeout(()=>modalEl.focus(),40);
}
function closeModal(){
  modalBackdrop.classList.remove('on');
  modalEl.classList.remove('on');
  document.body.style.overflow='';
  if(lastFocused&&lastFocused.focus)lastFocused.focus();
}
modalClose.addEventListener('click',closeModal);
modalBackdrop.addEventListener('click',closeModal);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalEl.classList.contains('on'))closeModal();});

document.querySelectorAll('.hs').forEach(el=>{
  const k=el.dataset.k;
  el.setAttribute('tabindex','0'); el.setAttribute('role','button');
  el.setAttribute('aria-label',DATA[k]?(DATA[k].t+', '+DATA[k].k.replace(/&amp;/g,'and')):k);
  el.addEventListener('click',e=>{e.stopPropagation();show(k);openModal(k);});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(k);openModal(k);}});
});
scene.addEventListener('pointerdown',e=>{
  if(!e.target.closest('.hs')){
    document.querySelectorAll('.hs').forEach(x=>x.classList.remove('on'));
    scene.classList.remove('focused');
  }
});
const groups={};
Object.values(DATA).forEach(d=>{(groups[d.k]=groups[d.k]||[]).push(d);});
let html='';
Object.entries(groups).forEach(([k,items])=>{
  html+='<h3>'+k+'</h3><dl>';
  items.forEach(d=>{html+='<dt>'+d.t+'</dt><dd>'+d.b+'</dd>';});
  html+='</dl>';
});
document.getElementById('list').innerHTML=html;
document.getElementById('tg').addEventListener('click',e=>{
  const l=document.getElementById('list'); l.classList.toggle('show');
  e.target.textContent=l.classList.contains('show')?'Hide text version':'Read everything as text';
});
</script>
